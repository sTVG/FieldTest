<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field testing for Agritech ventures</title>
<meta name="description" content="A bilingual planning tool for Agritech field tests. Incubators and founders prepare a test, check readiness, and print a one page field test plan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#2D2C3D; --orange:#D87043; --paper:#FAFAF7; --cream:#EFE8DF; --tint:#F7F3EE;
  --grey:#5F6472; --light:#8A8F9C; --rule:#D9D5CE; --card:#FFFFFF; --focus:#1F6FEB;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --maxw:1180px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F2F0EC; --orange:#E8865A; --paper:#1B1A24; --cream:#2A2935; --tint:#262531;
    --grey:#B7BAC4; --light:#8E92A0; --rule:#3C3B4A; --card:#232230; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --ink:#F2F0EC; --orange:#E8865A; --paper:#1B1A24; --cream:#2A2935; --tint:#262531;
  --grey:#B7BAC4; --light:#8E92A0; --rule:#3C3B4A; --card:#232230; --focus:#7FB0FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{
  margin:0; background:var(--paper); color:var(--grey);
  font-family:var(--serif); font-size:17px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,.ui{font-family:var(--sans); color:var(--ink)}
h1{font-size:1.6rem; line-height:1.2; margin:0}
h2{font-size:1.45rem; line-height:1.25; margin:0 0 .3em}
h3{font-size:1.02rem; margin:1.6em 0 .35em; font-weight:600}
p{margin:0 0 .9em}
a{color:var(--orange)}
img{max-width:100%}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
.skip{position:absolute; left:-9999px}
.skip:focus{left:12px; top:12px; z-index:100; background:var(--ink); color:#fff; padding:10px 14px; border-radius:6px}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:3px}

/* ---------- header ---------- */
header.top{background:var(--ink); color:#fff; padding:14px 0 0; position:sticky; top:0; z-index:40;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.brandrow{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap}
.brand{font-family:var(--sans); font-weight:700; letter-spacing:.22em; font-size:1.25rem; color:#fff}
.tagline{font-family:var(--sans); font-weight:600; font-size:.63rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--orange)}
.topright{margin-left:auto; display:flex; gap:8px; align-items:center}
.ghost{background:#4A4958; color:#FFFFFF; border:1px solid #6E6D7D; border-radius:999px;
  font-family:var(--sans); font-weight:500; font-size:.74rem; padding:5px 12px; cursor:pointer}
.ghost:hover{background:#5E5D6E; border-color:#8A899A}
.ghost.solid{background:var(--orange); border-color:var(--orange); color:#fff; font-weight:600}
.ghost.solid:hover{background:#C46034; border-color:#C46034}
:root[data-theme="dark"] .ghost.solid,
:root:not([data-theme="light"]) .ghost.solid{color:#20202C}
.vpill{font-family:var(--sans); font-weight:600; font-size:.7rem; padding:4px 11px; border-radius:999px;
  border:1px solid #6E6D7D; color:#fff; white-space:nowrap}
.vpill:empty{display:none}
.v_ready{background:#2F6B4C; border-color:#2F6B4C}
.v_nearly{background:#8A6A20; border-color:#8A6A20}
.v_postpone{background:#A2412F; border-color:#A2412F}
.v_nodate{background:#4A4958}

/* ---------- progress ---------- */
nav.steps{margin-top:12px; overflow-x:auto; -webkit-overflow-scrolling:touch}
nav.steps ol{display:flex; gap:2px; list-style:none; margin:0; padding:0 0 0 0; min-width:max-content}
nav.steps button{
  background:transparent; border:0; border-bottom:3px solid transparent; cursor:pointer;
  color:#AEB2BE; font-family:var(--sans); font-size:.76rem; padding:8px 12px 9px;
  display:flex; align-items:center; gap:7px; white-space:nowrap;
}
nav.steps button:hover{color:#fff}
nav.steps button[aria-current="step"]{color:#fff; border-bottom-color:var(--orange)}
nav.steps .dot{width:17px; height:17px; border-radius:50%; border:1.5px solid #595869;
  display:inline-flex; align-items:center; justify-content:center; font-size:.6rem; flex:none}
nav.steps button[aria-current="step"] .dot{border-color:var(--orange); background:var(--orange); color:#fff}
nav.steps button.done .dot{background:#4C7D63; border-color:#4C7D63; color:#fff}
.bar{height:3px; background:#3A3947}
.bar>i{display:block; height:100%; background:var(--orange); width:0; transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

/* ---------- panels ---------- */
main{padding:26px 0 90px}
.panel{display:none}
.panel.on{display:block; animation:fade .22s ease-out}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}}

.lede{font-size:1.02rem; max-width:62ch}
.eyebrow{font-family:var(--sans); font-weight:700; font-size:.64rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--orange); margin:0 0 6px}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:34px; align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr; gap:22px}}

.principle{background:var(--tint); border-left:3px solid var(--orange); padding:14px 16px; border-radius:0 8px 8px 0; margin:0 0 20px}
.principle p{font-style:italic; margin:0; font-size:.95rem}
.passes{border:1px solid var(--rule); border-radius:8px; padding:14px 16px; background:var(--card)}
.passes .eyebrow{color:var(--ink)}

.field{margin:0 0 22px; max-width:66ch}
.field label.q{display:block; font-family:var(--sans); font-weight:500; color:var(--ink); font-size:1rem; margin-bottom:3px}
.hint{font-size:.88rem; color:var(--light); margin:0 0 7px}
textarea{
  width:100%; min-height:76px; resize:vertical; padding:10px 12px; border-radius:8px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink);
  font-family:var(--serif); font-size:.97rem; line-height:1.5;
}
textarea:hover{border-color:var(--light)}
input[type=text]{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--rule);
  background:var(--card); color:var(--ink); font-family:var(--serif); font-size:.97rem}

/* explain-on-hover disclosure */
.explain{margin:0 0 9px}
.explain>button{
  background:none; border:0; padding:0; cursor:help; color:var(--orange);
  font-family:var(--sans); font-size:.76rem; font-weight:600; letter-spacing:.04em;
  display:inline-flex; align-items:center; gap:5px;
}
.explain>button .chev{transition:transform .18s}
.explain[data-open="1"]>button .chev{transform:rotate(90deg)}
.explain .body{
  display:none; margin-top:6px; padding:11px 13px; background:var(--tint);
  border-radius:8px; font-size:.9rem; color:var(--grey); max-width:62ch;
}
.explain[data-open="1"] .body{display:block}

/* choices */
.choices{display:flex; flex-direction:column; gap:7px; margin:4px 0 0}
.choice{display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border:1px solid var(--rule);
  border-radius:8px; background:var(--card); cursor:pointer; font-size:.94rem}
.choice:hover{border-color:var(--orange)}
.choice input{margin:3px 0 0; flex:none; width:17px; height:17px; accent-color:var(--orange)}
.choice .sub{display:block; font-size:.82rem; color:var(--light)}
.choice.warn:hover{border-color:#B4504A}

.scale{display:flex; flex-direction:column; gap:5px; margin:6px 0 10px; border:0; padding:0}
.scale legend{font-family:var(--sans); font-weight:500; color:var(--ink); font-size:1rem; padding:0}
.lvl{display:flex; gap:11px; align-items:flex-start; padding:7px 10px; border:1px solid var(--rule);
  border-radius:8px; background:var(--card); cursor:pointer; font-size:.92rem}
.lvl:hover{border-color:var(--orange)}
.lvl input{margin:3px 0 0; accent-color:var(--orange); flex:none}
.lvl b{font-family:var(--sans); color:var(--light); flex:none; width:12px}
.lvl.strong b{color:var(--orange)}
.lvl.strong span{color:var(--ink)}
.twoup{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media (max-width:620px){.twoup{grid-template-columns:1fr}}

/* nav buttons */
.navrow{display:flex; gap:12px; align-items:center; margin:30px 0 0; flex-wrap:wrap}
.btn{font-family:var(--sans); font-weight:600; font-size:.9rem; border-radius:999px; padding:11px 22px;
  border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer}
.btn:hover{background:#3C3B4C}
.btn.primary{background:var(--orange); border-color:var(--orange)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sec{background:transparent; color:var(--ink)}
.btn.sec:hover{background:var(--cream)}
.btn.link{background:none; border:0; color:var(--orange); padding:11px 4px; text-decoration:underline}

/* intro */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:14px; margin:22px 0}
.card{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:15px}
.card h4{margin:0 0 5px; font-size:.95rem; display:flex; gap:8px; align-items:baseline}
.card .L{color:var(--orange); font-weight:700}
.card p{font-size:.88rem; margin:0; color:var(--grey)}

/* summary */
.sheet{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:26px}
.verdict{border-radius:10px; padding:16px 18px; margin:0 0 20px; border:1px solid var(--rule); background:var(--tint)}
.verdict h3{margin:0 0 4px; font-size:1.3rem; color:var(--orange)}
.verdict p{margin:0; font-size:.95rem}
table.sum{width:100%; border-collapse:collapse; font-size:.9rem; margin:0 0 18px}
table.sum th,table.sum td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--rule); vertical-align:top}
table.sum th{font-family:var(--sans); font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink)}
.pill{font-family:var(--sans); font-size:.68rem; font-weight:600; padding:2px 9px; border-radius:999px;
  border:1px solid var(--rule); white-space:nowrap}
.pill.ok{background:#E6F0E9; color:#2C5E42; border-color:#BFD9C9}
.pill.no{background:#F7E9E4; color:#8C4234; border-color:#E7C8BD}
.pill.na{background:var(--cream); color:var(--grey)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .pill.ok{background:#22402F; color:#A8D9BE; border-color:#2F5942}
  :root:not([data-theme="light"]) .pill.no{background:#452A24; color:#E9B7A7; border-color:#5C382F}
}
ol.actions{padding-left:0; list-style:none; counter-reset:a; margin:0}
ol.actions li{counter-increment:a; position:relative; padding:0 0 11px 34px; font-size:.95rem}
ol.actions li::before{content:counter(a); position:absolute; left:0; top:1px; width:22px; height:22px;
  border-radius:50%; background:var(--orange); color:#fff; font-family:var(--sans); font-size:.75rem;
  font-weight:700; display:flex; align-items:center; justify-content:center}
.answers dt{font-family:var(--sans); font-weight:500; color:var(--ink); font-size:.85rem; margin-top:10px}
.answers dd{margin:1px 0 0; font-size:.9rem; white-space:pre-wrap}
.small{font-size:.82rem; color:var(--light)}
.foot{margin-top:34px; padding-top:14px; border-top:1px solid var(--rule); font-size:.78rem; color:var(--light)}
.saved{font-size:.78rem; color:var(--light); font-family:var(--sans)}
.sumhead{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:14px}
.sumhead h3{margin:0; font-size:1.25rem}
.sumhead p{margin:2px 0 0}
ul.small{margin:0 0 10px; padding-left:20px}
.qhead{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.tag{font-family:var(--sans); font-weight:700; font-size:.57rem; letter-spacing:.09em; text-transform:uppercase;
  padding:2px 8px; border-radius:999px; white-space:nowrap}
.tag.req{background:#A2412F; color:#fff}
.tag.rec{background:var(--cream); color:var(--grey)}
.choice .tag{margin-left:8px}
.choice.reqc{border-left:3px solid #A2412F}
.choice.big{padding:12px 13px}
.choice.big strong{font-size:1rem}
.typechoices{margin:6px 0 10px; max-width:66ch}
.mini{height:6px; background:var(--cream); border-radius:99px; overflow:hidden; margin:4px 0 6px}
.mini>i{display:block; height:100%; background:#2F6B4C}
.passes p{margin:0 0 3px}
.warnTxt{color:var(--orange)}
.verdict.v_ready{border-left:4px solid #2F6B4C}
.verdict.v_nearly{border-left:4px solid #8A6A20}
.verdict.v_postpone{border-left:4px solid #A2412F}
.verdict.v_nodate{border-left:4px solid var(--rule)}
.reqlist li{color:#A2412F}
.ok{color:#2F6B4C}
.signrow{display:flex; justify-content:space-between; gap:20px; margin:26px 0 0; font-family:var(--sans);
  font-size:.82rem; color:var(--ink); flex-wrap:wrap}
dl.answers dt{margin-top:9px}


/* print */
@media print{
  header.top,nav.steps,.bar,.navrow,.noprint{display:none !important}
  body{background:#fff; color:#222; font-size:10.5pt}
  .wrap{max-width:none; padding:0}
  main{padding:0}
  .panel{display:none !important}
  #p-summary{display:block !important}
  .sheet{border:0; padding:0}
  .verdict{background:#f4f1ec; border:1px solid #ddd}
  h1,h2,h3,h4{color:#000}
  a{color:#000; text-decoration:none}
  table.sum{font-size:9pt}
  @page{margin:14mm}
}
</style>
</head>
<body>
<a class="skip" href="#main" id="skipLink">Skip to content</a>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <span class="brand">FIELD&nbsp;TEST</span>
      <span class="tagline" id="tagline">Field testing for Agritech ventures</span>
      <span class="topright">
        <span class="vpill v_nodate" id="vSmall"></span>
        <button class="ghost solid" id="langBtn" type="button" lang="fr">Français</button>
        <button class="ghost" id="themeBtn" type="button">Dark</button>
        <button class="ghost" id="resetBtn" type="button">Clear</button>
      </span>
    </div>
    <nav class="steps" id="stepNavWrap" aria-label="Progress"><ol id="stepNav"></ol></nav>
  </div>
  <div class="bar"><i id="barFill"></i></div>
</header>

<main id="main">
  <div class="wrap">
    <p aria-live="polite" class="skip" id="live"></p>
    <div id="panels"></div>
  </div>
</main>

<script>
/* Field test planner. Structure is language independent; labels live in L. */

var TYPES = ["device","digital","advice","service"];

var SECTIONS = [
 {id:"test", when:null, items:[
   ["q_one","area",0],["q_yes","area",0],["q_no","area",1],["q_small","area",0]]},
 {id:"people", when:null, items:[
   ["p_three","check",1],["p_roles","area",0],["p_ground","check",0],
   ["p_consent","check",1],["p_assume","area",0]]},
 {id:"place", when:null, items:[
   ["c_site","area",0],["c_perm","check",1],["c_season","check",0],["c_visit","check",0],
   ["c_coverage","check",0,"digital"],["c_alongside","check",0],["c_endtold","check",1]]},
 {id:"proto", when:null, items:[
   ["d_run","check",0],["d_fail","check",0],["d_safe","check",1],["d_safetext","area",0],
   ["d_spares","check",0,"device"],["d_version","check",0,"digital"]]},
 {id:"physical", when:["device"], items:[
   ["e_haz","check",1],["e_mains","check",1],["e_stop","check",1],
   ["e_bystand","check",0],["e_firstaid","check",1]]},
 {id:"digital", when:["digital"], items:[
   ["f_device","check",0],["f_signup","check",0],["f_nosignal","check",0],
   ["f_datacost","area",0],["f_money","check",1]]},
 {id:"data", when:["digital","advice","service"], items:[
   ["g_min","check",0],["g_explain","check",1],["g_own","check",1],["g_offdevice","check",0]]},
 {id:"advice", when:["advice"], items:[
   ["h_suggest","check",1],["h_review","check",1],["h_noauto","check",1],["h_disagree","check",0]]},
 {id:"arrange", when:null, items:[
   ["i_named","area",1],["i_ins","check",1],["i_nopromise","check",0],
   ["i_report","check",0],["i_thanks","check",0]]},
 {id:"measure", when:null, items:[
   ["j_compare","area",1],["j_observe","area",0],["j_collect","multi",0],
   ["j_digital","multi",0,"digital"]]},
 {id:"after", when:null, after:true, items:[
   ["k_result","area",0],["k_notwork","area",0],["k_notunderstood","area",0],
   ["k_notwanted","area",0],["k_notworth","area",0],["k_change","area",0],["k_next","area",0],
   ["k_removed","check",0],["k_deleted","check",0],["k_summary","check",0]]}
];

var COLLECT = ["photos","readings","faults","quotes","video","baseline"];
var DIGMET  = ["activation","firstvalue","completion","return","support","dropoff","dataused"];

var L = {

en:{
dir:"ltr", other:"Français", otherCode:"fr",
brand:"Field testing for Agritech ventures",
theme:["Dark","Light"], clear:"Clear", progress:"Progress", skip:"Skip to content",
back:"Back", next:"Next", startBtn:"Start", print:"Print or save as PDF", download:"Download a copy",
savedNote:"Saved on this device", stepOf:"Step %1 of %2: %3",
confirmClear:"Clear everything you have entered on this device?",
whyQ:"Why this matters", required:"Required before the test", recommended:"Recommended",
outstanding:"Outstanding", done:"Done",

nav:["Start","The test","People","Place","Prototype","Physical risk","Digital","Data","Advice","Arrangements","Measurement","After the test","Summary"],

introTitle:"Preparing a prototype for a test under real conditions",
introP1:"A short planning tool for incubators, mentors and founders. It covers how to prepare a field test, how to look after the people taking part, and what evidence to bring back. It does not cover design or engineering.",
introP2:"It applies to any kind of prototype. In Agritech most ventures are some combination of a device, an application and a service delivered by people, and the preparation is largely the same for all three. Tell it what you are testing and it will show only the parts that apply.",
whatIs:"What counts as a prototype here",
whatList:["A physical device: a sensor, a controller, a machine, a piece of equipment.",
 "A digital product: a mobile application, a web service, a dashboard, a message based service.",
 "A data or advisory product: a recommendation, a grade, a forecast, a price signal.",
 "A service delivered by people: testing, grading, spraying, matching buyers to growers, training.",
 "Any combination of these, which is the usual case."],
typeH:"What are you testing?",
typeHint:"Choose everything that applies. This decides which sections you are shown.",
types:{device:["A physical device","Sensors, controllers, machines, equipment"],
 digital:["A digital product","An application, a web service, a dashboard, a message based service"],
 advice:["Advice or a recommendation","Anything that tells someone when to irrigate, when to spray, what to charge"],
 service:["A service delivered by people","Testing, grading, matching, training, anything done for the user"]},
ventureH:"The venture and the test",
mVname:"Venture", mVwho:"Who is running the test", mVmentor:"Mentor or incubator",
patterns:"Common patterns in first field tests",
patternList:["The team tests whether the prototype works, rather than whether anyone needs it.",
 "The test runs with one friendly user, who confirms what the team already believes.",
 "Nothing is measured against what the user does today, so there is no comparison.",
 "For digital products, the test runs on the team\u2019s phone rather than the user\u2019s, and on the team\u2019s network.",
 "Problems are explained away during the session instead of being recorded."],
sieveNote:"If you use the SIEVE idea filter, this is the point at which the canvas stops being a conversation and starts producing evidence. Complete the canvas first, and bring the comparison measure from the Existing filter with you.",
disclaimer:"This tool gives general guidance. It does not replace the judgement of people who know your market, and it is not professional, legal or safety advice.",

sections:{
 test:{t:"The test", lede:"One question, and what would answer it.",
  p:"A field test exists to answer a question, not to show that something works. If no result would change the plan, this is a demonstration."},
 people:{t:"People", lede:"Who takes part, and what you are assuming about them.",
  p:"Evidence from people who have a reason to be kind to you is not evidence. The person who uses a thing, the person who decides and the person who pays are often three different people in Agritech."},
 place:{t:"Place and season", lede:"Where it happens, and whether the season allows it.",
  p:"Agricultural cycles are slow and unforgiving. A test planned for the wrong month either waits a year or measures nothing. Coverage, access and permission are all easier to establish before the day than on it."},
 proto:{t:"Prototype readiness", lede:"Whether the thing itself is ready to leave the workshop.",
  p:"Most field failures are not design failures. They are things that were never tried under the conditions the test will create."},
 physical:{t:"Physical risk", lede:"Shown because you are testing a physical device.",
  p:"Eliminate a hazard rather than manage it wherever you can. Choosing a 12 V pump instead of a 230 V one removes a risk rather than controlling it, and that choice is usually still available early on."},
 digital:{t:"Digital product", lede:"Shown because you are testing an application or service.",
  p:"A digital field test happens on the user\u2019s own phone, on their own network, in their own place. Anything else measures your conditions rather than theirs."},
 data:{t:"Data and privacy", lede:"Shown because you are collecting information about people or farms.",
  p:"Data about a farm, its yields, its prices or its finances belongs to the farmer. Collect the minimum needed to answer your question, and say plainly what you keep."},
 advice:{t:"Advice and recommendations", lede:"Shown because your prototype tells someone what to do.",
  p:"A product that says when to irrigate, when to spray or what price to accept can cause loss with nothing physical involved. Treat it with the same care as a moving part."},
 arrange:{t:"Arrangements", lede:"Who is responsible, and what happens if something goes wrong.",
  p:"These are the items an incubator is usually best placed to check, and the ones founders most often leave until the morning of the test."},
 measure:{t:"Measurement plan", lede:"What you will compare against, and what you will bring back.",
  p:"Decide the comparison before you go. A result with nothing to compare it against is an anecdote, however carefully it was measured."},
 after:{t:"After the test", lede:"Complete this when you return.",
  p:"Hold the debrief within a day. Separating what did not work from what was not understood, what was not wanted and what was not worth the cost is the difference between a fix and a pivot."}
},

f:{
 q_one:["What one question will this test answer?","One question, phrased so a result can answer it.",
  "\u201cWill a grower accept the recommendation without being persuaded?\u201d is a question. \u201cDoes it work?\u201d is not. Teams that write several questions usually answer none of them."],
 q_yes:["What result would mean yes?","Write the number or the outcome, before you go.",null],
 q_no:["What result would mean no, or make you stop?","If no result would stop you, this is a demonstration and not a test.",
  "Write it down before the test and do not change it afterwards. This single habit prevents most of the self-deception in early ventures."],
 q_small:["What is the smallest version that still answers it?","Often a person doing the work by hand, or a message in a group they already use.",
  "Consider running it with no technology at all, to check that the output is wanted before building the means to produce it. For anything that controls water, power, feed or machinery, run it in report only mode first: let it state what it would have done, and compare that with what the user actually did."],
 p_three:["At least three users who do not know each other","And preferably not the person who suggested the idea.",
  "One friendly user will confirm whatever you hope. Three unconnected users will not agree with each other unless something is actually true."],
 p_roles:["Who uses it, who decides, and who pays","Name a person or a role for each.",
  "On a family holding these are often three people: the worker who uses it, the senior family member who decides, and whoever controls the money."],
 p_ground:["The person who does the work on the ground is included","Even where they are not the customer.",null],
 p_consent:["Participants know this is unfinished, and have agreed to be recorded","They are helping test something, not receiving a service.",
  "Say plainly that it may not work, that you will take photographs or readings, and what you will do with them. Make no promise about future supply, price or support."],
 p_assume:["What are you assuming about language, literacy and equipment?","Which language, read or spoken, and what device do they actually have?",
  "For a digital product these assumptions usually decide the result. An interface in French, read by someone who prefers Arabic, on a phone with no storage left, is three failures that will be reported as one."],
 c_site:["Where and when","Site, dates, and who will be present.",null],
 c_perm:["Written permission from the owner of the land, crop or equipment","Not a verbal agreement with whoever was there that day.",null],
 c_season:["The season and weather allow what you need to observe","Check this against the crop calendar, not the test schedule.",
  "Where a full cycle cannot be observed within the programme, agree a proxy measure in advance and record it. Do not redefine it afterwards to produce a result."],
 c_visit:["The site has been visited in advance","Access, power, shade, coverage.",null],
 c_coverage:["Tested where coverage is poor, not only where it is good","Coverage in the office is not a result.",null],
 c_alongside:["The test runs alongside current practice, not instead of it","At least for the first test.",
  "Never test on a crop, animal, income or customer relationship the user depends on. If the prototype fails, nothing of theirs should fail with it."],
 c_endtold:["Users have been told when the test ends and what happens then","People begin to rely on a service quickly.",null],
 d_run:["It has run continuously for longer than the test will last","Under controlled conditions, before leaving.",null],
 d_fail:["Behaviour on loss of power, water, signal or sunlight has been tried","Tried, not assumed.",null],
 d_safe:["It returns to a safe state by itself","Agreed and written down.",
  "The safe state is not always off. For an irrigation pump it is off; for a greenhouse vent in summer it is open; for a brooder in winter the heat stays on. Decide which, and make the system reach it without help."],
 d_safetext:["What is the safe state?","One line.",null],
 d_spares:["Spares, tools and consumables are packed","Including the parts most likely to fail.",null],
 d_version:["A known working version is set aside, and nothing changes during the test","No fixes mid-test.",
  "Changing the product during a test means you no longer know which version produced which result. Write the problem down and fix it afterwards."],
 e_haz:["Electrical, water, moving parts, heat, chemicals and height are identified and controlled","Write the list before you go.",null],
 e_mains:["Anything connected to mains is enclosed and prepared by a qualified person","No improvised mains wiring, ever.",
  "Never connect a USB serial adapter to a mains powered device. There is no isolation, and the risk transfers to the person holding the laptop."],
 e_stop:["Anybody on site can stop it without instructions","Including someone who was not briefed.",null],
 e_bystand:["Livestock, children and uninvolved workers have been considered","Not only the participants.",null],
 e_firstaid:["First aid, the nearest clinic and phone coverage are known","Before the day, not during it.",null],
 f_device:["Tested on the user\u2019s own device","Their operating system, screen, storage and battery.",
  "A demonstration phone owned by the team is the most common reason a digital field test produces a misleading result."],
 f_signup:["A user completed sign-up with no help from the team","Watch where they stop.",
  "Sign-up is where most people are lost, and it is the part teams never test because they already know their own product."],
 f_nosignal:["Behaviour with no signal, and on signal returning, has been checked","Including what happens to data entered offline.",null],
 f_datacost:["Who pays for the data this test consumes?","Record the answer.",
  "If the venture pays, a real constraint has been removed and the result should say so. Data cost is a genuine reason people stop using a product."],
 f_money:["No money is handled through the prototype","Use the payment arrangements people already use.",null],
 g_min:["Only the minimum data needed to answer the question is collected","Not everything the system could record.",null],
 g_explain:["What is collected, who sees it and how long it is kept has been explained in the user\u2019s language","And how to have it removed.",null],
 g_own:["Farm data ownership and publication have been agreed with the participants","Yields, prices and finances belong to the farmer.",null],
 g_offdevice:["Personal data is kept off shared laptops, group chats and presentation screenshots","Including the ones used to report back.",null],
 h_suggest:["Output is presented as a suggestion, with the reasoning shown","The decision stays with the user.",null],
 h_review:["The logic has been reviewed by a qualified agronomist before reaching a farm","Someone who is not on the team.",
  "A wrong irrigation or spray recommendation can cost a season. The fact that no machinery is involved does not reduce the harm."],
 h_noauto:["No action is automated on the strength of an untested recommendation","Report first. Control is earned.",null],
 h_disagree:["Every case where the user disagreed with the recommendation will be recorded","These are the most useful records the test produces.",
  "Disagreements tell you where the model is wrong, and they also tell you whether the user is beginning to trust it."],
 i_named:["Who is responsible on the day?","One name.",null],
 i_ins:["Insurance and liability have been checked with the incubator or institution","In writing.",
  "If a participant is injured or a crop is damaged, this question will be asked. It is much easier to answer beforehand."],
 i_nopromise:["No promises have been made about future supply, price or support","Participants are helping, not buying.",null],
 i_report:["There is a way to report a problem that does not depend on a founder being present","A number, a person, a form.",null],
 i_thanks:["Participants are thanked appropriately, and not conditionally on a good result","Thanks should not depend on the outcome.",null],
 j_compare:["What will you compare against, and how will you measure both?","The same method for the current practice and for your prototype.",
  "If you cannot measure what they do today, you cannot later claim to have beaten it. Collect the current figure from three separate users rather than estimating it."],
 j_observe:["What will you watch for?","Behaviour, not opinions.",
  "Where they hesitate, what has to be explained twice, what they ignore or work around, who they show it to unprompted, whether they return to it the next day. For digital products: where they stop during sign-up, who is actually holding the phone, and whether they report a fault or simply stop."],
 j_collect:["What will you collect?","Tick everything you will bring back.",null],
 j_digital:["Digital figures to record","Small numbers mislead. Where few people took part, describe what happened rather than calculating a rate.",null],
 k_result:["What was measured, and under what conditions?","Including the parts that did not go your way.",null],
 k_notwork:["What did not work?","Faults, breakages, things that behaved differently in the field.",null],
 k_notunderstood:["What was not understood?","Where people needed explanation, or used it wrongly.",null],
 k_notwanted:["What was not wanted?","Features ignored, or the whole thing politely declined.",null],
 k_notworth:["What worked but was not worth the cost or effort to the user?","Including data cost, time, and change to their routine.",
  "This is the category teams most often miss. A product can work perfectly and still not be worth what it asks of the person using it."],
 k_change:["What changes as a result?","One or two decisions, not a list of improvements.",null],
 k_next:["What is the question for the next test?","Write it now, while it is clear.",null],
 k_removed:["Equipment removed, site restored, nothing left running","Leave it as you found it.",null],
 k_deleted:["Data that was only needed for the test has been deleted","As you told the participants you would.",null],
 k_summary:["A short summary has been sent to the participants","It costs little and it is why they agree to a second test.",null]
},

introTitle:"Préparer un prototype à un essai en conditions réelles",
introP1:"Un outil de préparation court, destiné aux incubateurs, aux accompagnateurs et aux fondateurs. Il traite de la préparation d\u2019un essai de terrain, du soin à apporter aux participants, et des preuves à en rapporter. Il ne traite ni de conception ni d\u2019ingénierie.",
introP2:"Il s\u2019applique à tout type de prototype. En Agritech, la plupart des projets combinent un appareil, une application et un service rendu par des personnes, et la préparation est largement la même. Indiquez ce que vous testez et l\u2019outil n\u2019affichera que les parties qui s\u2019appliquent.",
whatIs:"Ce qui compte ici comme prototype",

 digital:["Un produit numérique","Une application, un service web, un tableau de bord, un service par messagerie"],
 advice:["Un conseil ou une recommandation","Tout ce qui indique quand irriguer, quand traiter, quel prix pratiquer"],
 service:["Un service rendu par des personnes","Analyse, calibrage, mise en relation, formation, tout ce qui est fait pour l\u2019utilisateur"]},
ventureH:"Le projet et l\u2019essai",
mVname:"Projet", mVwho:"Qui mène l\u2019essai", mVmentor:"Accompagnateur ou incubateur",
patterns:"Schémas courants des premiers essais",
patternList:["L\u2019équipe vérifie si le prototype fonctionne, plutôt que si quelqu\u2019un en a besoin.",
 "L\u2019essai se déroule avec un seul utilisateur bienveillant, qui confirme ce que l\u2019équipe croit déjà.",
 "Rien n\u2019est mesuré par rapport à la pratique actuelle, donc aucune comparaison n\u2019est possible.",

sieveNote:"Si vous utilisez le filtre à idées SIEVE, c\u2019est le moment où le canevas cesse d\u2019être une conversation pour produire des preuves. Complétez-le d\u2019abord, et apportez la mesure de comparaison issue du filtre Existant.",
disclaimer:"Cet outil donne des orientations générales. Il ne remplace pas le jugement de personnes qui connaissent votre marché, et ne constitue ni un conseil professionnel, ni juridique, ni de sécurité.",

sections:{
 test:{t:"L\u2019essai", lede:"Une question, et ce qui y répondrait.",
  p:"Un essai de terrain existe pour répondre à une question, non pour montrer qu\u2019une chose fonctionne. Si aucun résultat ne changerait le plan, il s\u2019agit d\u2019une démonstration."},
 people:{t:"Personnes", lede:"Qui participe, et ce que vous supposez à leur sujet.",
  p:"Une preuve venant de gens qui ont une raison d\u2019être aimables n\u2019est pas une preuve. Celui qui utilise, celui qui décide et celui qui paie sont souvent trois personnes différentes en Agritech."},
 place:{t:"Lieu et saison", lede:"Où cela se passe, et si la saison le permet.",
  p:"Les cycles agricoles sont lents et sans indulgence. Un essai prévu au mauvais mois attend un an ou ne mesure rien. La couverture réseau, l\u2019accès et les autorisations s\u2019établissent plus facilement avant le jour même."},
 proto:{t:"Préparation du prototype", lede:"Si la chose elle-même est prête à quitter l\u2019atelier.",
  p:"La plupart des défaillances de terrain ne sont pas des défauts de conception. Ce sont des situations qui n\u2019ont jamais été essayées dans les conditions que l\u2019essai va créer."},
 physical:{t:"Risque physique", lede:"Affiché car vous testez un appareil physique.",
  p:"Supprimez un danger plutôt que de le gérer chaque fois que c\u2019est possible. Choisir une pompe 12 V plutôt que 230 V supprime un risque au lieu de le contrôler, et ce choix reste généralement disponible au début."},
 digital:{t:"Produit numérique", lede:"Affiché car vous testez une application ou un service.",
  p:"Un essai numérique se déroule sur le téléphone de l\u2019utilisateur, sur son réseau, dans son lieu. Tout le reste mesure vos conditions, non les siennes."},
 data:{t:"Données et vie privée", lede:"Affiché car vous recueillez des informations sur des personnes ou des exploitations.",
  p:"Les données d\u2019une exploitation, ses rendements, ses prix ou ses finances appartiennent à l\u2019agriculteur. Ne recueillez que le minimum nécessaire, et dites clairement ce que vous conservez."},
 advice:{t:"Conseils et recommandations", lede:"Affiché car votre prototype indique à quelqu\u2019un quoi faire.",
  p:"Un produit qui indique quand irriguer, quand traiter ou quel prix accepter peut causer une perte sans qu\u2019aucun élément physique ne soit en jeu. Traitez-le avec le même soin qu\u2019une pièce en mouvement."},
 arrange:{t:"Organisation", lede:"Qui est responsable, et que se passe-t-il en cas de problème.",
  p:"Ce sont les points qu\u2019un incubateur est le mieux placé pour vérifier, et ceux que les fondateurs laissent le plus souvent au matin de l\u2019essai."},
 measure:{t:"Plan de mesure", lede:"Ce à quoi vous comparerez, et ce que vous rapporterez.",
  p:"Décidez de la comparaison avant de partir. Un résultat sans point de comparaison est une anecdote, aussi soigneusement mesuré soit-il."},
 after:{t:"Après l\u2019essai", lede:"À compléter au retour.",
  p:"Faites le débriefing dans la journée. Distinguer ce qui n\u2019a pas fonctionné de ce qui n\u2019a pas été compris, de ce qui n\u2019était pas souhaité et de ce qui ne valait pas le coût, c\u2019est la différence entre une correction et un pivot."}
},

f:{
 q_one:["À quelle question unique cet essai répondra-t-il ?","Une seule question, formulée pour qu\u2019un résultat puisse y répondre.",
  "\u00ab Un producteur acceptera-t-il la recommandation sans être persuadé ? \u00bb est une question. \u00ab Est-ce que cela marche ? \u00bb n\u2019en est pas une. Les équipes qui écrivent plusieurs questions n\u2019en traitent généralement aucune."],
 q_yes:["Quel résultat signifierait oui ?","Écrivez le chiffre ou l\u2019issue, avant de partir.",null],
 q_no:["Quel résultat signifierait non, ou vous ferait arrêter ?","Si aucun résultat ne vous arrêterait, il s\u2019agit d\u2019une démonstration et non d\u2019un essai.",
  "Écrivez-le avant l\u2019essai et ne le modifiez pas ensuite. Cette seule habitude évite l\u2019essentiel de l\u2019auto-illusion."],
 q_small:["Quelle est la plus petite version qui y répond encore ?","Souvent une personne faisant le travail à la main, ou un message dans un groupe qu\u2019ils utilisent déjà.",
  "Envisagez de le faire sans aucune technologie, pour vérifier que le résultat est souhaité avant de construire le moyen de le produire. Pour tout ce qui commande l\u2019eau, l\u2019énergie, l\u2019alimentation ou une machine, commencez en mode signalement seul : le système indique ce qu\u2019il aurait fait, et cela est comparé à ce que l\u2019utilisateur a réellement fait."],

 p_ground:["La personne qui fait le travail sur le terrain est incluse","Même si elle n\u2019est pas le client.",null],

  "Pour un produit numérique, ces hypothèses déterminent généralement le résultat. Une interface en français, lue par quelqu\u2019un qui préfère l\u2019arabe, sur un téléphone sans espace disponible, ce sont trois échecs qui seront rapportés comme un seul."],
 c_site:["Où et quand","Lieu, dates, et qui sera présent.",null],
 c_perm:["Autorisation écrite du propriétaire de la terre, de la culture ou de l\u2019équipement","Pas un accord verbal avec qui se trouvait là ce jour-là.",null],

 g_min:["Seules les données minimales nécessaires sont recueillies","Pas tout ce que le système pourrait enregistrer.",null],
 g_explain:["Ce qui est recueilli, qui le voit et combien de temps c\u2019est conservé a été expliqué dans la langue de l\u2019utilisateur","Ainsi que la manière de le faire supprimer.",null],
 g_own:["La propriété et la publication des données de l\u2019exploitation ont été convenues avec les participants","Rendements, prix et finances appartiennent à l\u2019agriculteur.",null],
 g_offdevice:["Les données personnelles restent hors des ordinateurs partagés, des groupes de discussion et des captures de présentation","Y compris celles du compte rendu.",null],
 h_suggest:["La sortie est présentée comme une suggestion, avec le raisonnement visible","La décision reste à l\u2019utilisateur.",null],
 h_review:["La logique a été relue par un agronome qualifié avant d\u2019arriver sur une exploitation","Une personne extérieure à l\u2019équipe.",
  "Une recommandation erronée d\u2019irrigation ou de traitement peut coûter une saison. L\u2019absence de machine n\u2019atténue pas le préjudice."],
 h_noauto:["Aucune action n\u2019est automatisée sur la base d\u2019une recommandation non éprouvée","Signaler d\u2019abord. La commande se mérite.",null],
 h_disagree:["Chaque cas de désaccord de l\u2019utilisateur avec la recommandation sera consigné","Ce sont les relevés les plus utiles que produit l\u2019essai.",
  "Les désaccords indiquent où le modèle se trompe, et ils indiquent aussi si l\u2019utilisateur commence à lui faire confiance."],
 i_named:["Qui est responsable le jour même ?","Un seul nom.",null],
 i_ins:["L\u2019assurance et la responsabilité ont été vérifiées auprès de l\u2019incubateur ou de l\u2019établissement","Par écrit.",
  "Si un participant est blessé ou une culture endommagée, cette question sera posée. Il est bien plus facile d\u2019y répondre à l\u2019avance."],
 i_nopromise:["Aucune promesse sur une fourniture, un prix ou un soutien futurs","Les participants aident, ils n\u2019achètent pas.",null],
 i_report:["Il existe un moyen de signaler un problème qui ne dépend pas de la présence d\u2019un fondateur","Un numéro, une personne, un formulaire.",null],
 i_thanks:["Les participants sont remerciés de manière appropriée, et non conditionnée à un bon résultat","Le remerciement ne doit pas dépendre de l\u2019issue.",null],
 j_compare:["À quoi comparerez-vous, et comment mesurerez-vous les deux ?","La même méthode pour la pratique actuelle et pour votre prototype.",
  "Si vous ne pouvez mesurer ce qu\u2019ils font aujourd\u2019hui, vous ne pourrez prétendre l\u2019avoir dépassé. Recueillez le chiffre actuel auprès de trois utilisateurs distincts plutôt que de l\u2019estimer."],
 j_observe:["Que surveillerez-vous ?","Les comportements, non les opinions.",
  "Où ils hésitent, ce qu\u2019il faut expliquer deux fois, ce qu\u2019ils ignorent ou contournent, à qui ils le montrent spontanément, s\u2019ils y reviennent le lendemain. Pour un produit numérique : où ils s\u2019arrêtent pendant l\u2019inscription, qui tient réellement le téléphone, et s\u2019ils signalent une panne ou cessent simplement."],
 j_collect:["Que recueillerez-vous ?","Cochez tout ce que vous rapporterez.",null],
 j_digital:["Chiffres numériques à consigner","Les petits nombres trompent. Si peu de personnes ont participé, décrivez ce qui s\u2019est passé plutôt que de calculer un taux.",null],
 k_result:["Qu\u2019a-t-on mesuré, et dans quelles conditions ?","Y compris ce qui ne vous a pas été favorable.",null],
 k_notwork:["Qu\u2019est-ce qui n\u2019a pas fonctionné ?","Pannes, casses, comportements différents sur le terrain.",null],
 k_notunderstood:["Qu\u2019est-ce qui n\u2019a pas été compris ?","Là où il a fallu expliquer, ou là où l\u2019usage a été erroné.",null],
 k_notwanted:["Qu\u2019est-ce qui n\u2019était pas souhaité ?","Fonctions ignorées, ou ensemble poliment décliné.",null],
 k_notworth:["Qu\u2019est-ce qui fonctionnait sans valoir le coût ou l\u2019effort pour l\u2019utilisateur ?","Y compris le coût des données, le temps, et le changement d\u2019habitudes.",
  "C\u2019est la catégorie que les équipes oublient le plus souvent. Un produit peut fonctionner parfaitement sans valoir ce qu\u2019il demande à celui qui l\u2019utilise."],
 k_change:["Qu\u2019est-ce qui change en conséquence ?","Une ou deux décisions, non une liste d\u2019améliorations.",null],
 k_next:["Quelle est la question du prochain essai ?","Écrivez-la maintenant, tant qu\u2019elle est claire.",null],
 k_removed:["Équipement retiré, lieu remis en état, rien laissé en fonctionnement","Laissez-le comme vous l\u2019avez trouvé.",null],
 k_deleted:["Les données qui n\u2019étaient nécessaires que pour l\u2019essai ont été supprimées","Comme vous l\u2019avez annoncé aux participants.",null],
 k_summary:["Un court résumé a été envoyé aux participants","Cela coûte peu et c\u2019est pourquoi ils acceptent un second essai.",null]
},
collect:{photos:"Photographies avant, pendant et après, y compris de la méthode actuelle",
 readings:"Relevés et horaires, notés au moment où ils sont pris",
 faults:"Un relevé continu de chaque défaillance, de sa cause et de ce qui a été fait",
 quotes:"Citations directes, écrites telles qu\u2019elles ont été dites",
 video:"Une courte vidéo du fonctionnement, et de la défaillance si elle survient",
 baseline:"Le chiffre de comparaison de la pratique actuelle sur la même période"},
digmet:{activation:"Parmi ceux à qui il a été présenté, combien ont terminé l\u2019installation sans aide",
 firstvalue:"Le délai entre la première ouverture et le premier résultat utile",
 completion:"Le taux d\u2019achèvement de la tâche principale",
 return:"Combien sont revenus la semaine suivante sans rappel",
 support:"Les messages reçus demandant de l\u2019aide, et sur quels sujets",
 dropoff:"Combien ont cessé de l\u2019utiliser, et à quel moment",
 dataused:"Les données consommées pendant l\u2019essai, et ce que cela coûte à l\u2019utilisateur"},

verdict:{
 ready:["Prêt à partir","Tout ce qui est exigé avant l\u2019essai est en place. Les points recommandés encore ouverts sont listés ci-dessous, à vous de juger s\u2019ils importent pour cet essai."],
 nearly:["Presque prêt","Tout ce qui est exigé est en place. Des points recommandés restent ouverts, et chacun vous coûte généralement des preuves plutôt que de la sécurité."],
 postpone:["Reporter","Des points exigés avant l\u2019essai restent ouverts. Chacun relève de la sécurité, des autorisations ou du devoir de vigilance. Un essai qui blesse quelqu\u2019un, endommage une culture, perd les données d\u2019une personne ou met un hôte dans l\u2019embarras coûte plus cher que le report."],
 nodate:["Non commencé","Indiquez ce que vous testez, puis parcourez les sections."]},

sum:{title:"Synthèse", plan:"Plan d\u2019essai de terrain", untitled:"Projet sans titre",
 stamp:"Plan d\u2019essai de terrain", mentorL:"Accompagnateur", whoL:"Mène l\u2019essai", respL:"Responsable le jour même",
 testH:"L\u2019essai", peopleH:"Personnes et lieu", measureH:"Mesure",
 reqH:"Points exigés encore ouverts", recH:"Points recommandés encore ouverts",
 debriefH:"Débriefing", allClear:"Aucun. Tous les points exigés sont complets.",
 noRec:"Aucun. Tous les points recommandés sont complets.",
 progressH:"État de préparation", ofRequired:"%1 points exigés complets sur %2",
 ofRec:"%1 points recommandés complets sur %2",
 typesH:"Objet de l\u2019essai", signH:"Validé par", dateH:"Date",
 foot:"Guide des essais de terrain pour les projets Agritech. Créé par Steve Gray \u00b7 steve@themakerspace.co.za. Ce plan est généré à partir de vos propres réponses selon un ensemble de règles fixes. Il donne des orientations générales et ne remplace pas un conseil professionnel en matière de sécurité, de droit ou d\u2019agronomie."}
}
};

</script>
<script>
(function(){
"use strict";
var KEY="fieldtest.v1";
var S={meta:{},f:{},c:{},types:{}};
var lang="en", T=L.en, cur=0, ORDER=null;

function load(){
  try{var r=localStorage.getItem(KEY); if(r){var o=JSON.parse(r);
    if(o&&typeof o==="object"){S.meta=o.meta||{};S.f=o.f||{};S.c=o.c||{};S.types=o.types||{};}}}catch(e){}
  try{var l=localStorage.getItem(KEY+".lang"); if(l==="fr"||l==="en") lang=l;}catch(e){}
  if(lang==="en"){var seen=false; try{seen=!!localStorage.getItem(KEY+".lang");}catch(e){}
    if(!seen&&(navigator.language||"").toLowerCase().indexOf("fr")===0) lang="fr";}
  T=L[lang];
}
var tmr=null;
function save(){clearTimeout(tmr);tmr=setTimeout(function(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  var n=document.getElementById("savedNote"); if(n)n.textContent=T.savedNote;},350);}
function txt(k){return (S.f[k]||"").trim();}
function chk(k){return !!S.c[k];}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function sub(s){var a=arguments;return String(s).replace(/%(\d)/g,function(_,i){return a[+i];});}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function anyType(){for(var i=0;i<TYPES.length;i++){if(S.types[TYPES[i]])return true;}return false;}
function hasType(t){return !!S.types[t];}

/* which sections are shown */
function visibleSections(){
  return SECTIONS.filter(function(s){
    if(!s.when) return true;
    for(var i=0;i<s.when.length;i++){ if(hasType(s.when[i])) return true; }
    return false;
  });
}
function visibleItems(sec){
  return sec.items.filter(function(it){ return !it[3] || hasType(it[3]); });
}
/* all visible items across visible sections, excluding the after-the-test section */
function planItems(){
  var out=[];
  visibleSections().forEach(function(s){
    if(s.after) return;
    visibleItems(s).forEach(function(it){ out.push(it); });
  });
  return out;
}
function itemDone(it){
  return it[1]==="check" ? chk(it[0]) : (it[1]==="multi" ? true : !!txt(it[0]));
}

/* ---------- pieces ---------- */
function explain(text){
  var w=el("div","explain");w.setAttribute("data-open","0");
  var b=el("button","","<span class='chev'>\u203A</span> "+T.whyQ);b.type="button";b.setAttribute("aria-expanded","false");
  var body=el("div","body",text);var id="x"+Math.random().toString(36).slice(2,8);
  body.id=id;b.setAttribute("aria-controls",id);
  var st=false;
  function set(o){w.setAttribute("data-open",o?"1":"0");b.setAttribute("aria-expanded",o?"true":"false");}
  b.addEventListener("click",function(){st=!st;set(st);});
  w.addEventListener("mouseenter",function(){if(!st)set(true);});
  w.addEventListener("mouseleave",function(){if(!st)set(false);});
  b.addEventListener("focus",function(){set(true);});
  b.addEventListener("blur",function(){if(!st)set(false);});
  w.appendChild(b);w.appendChild(body);return w;
}
function tag(req){
  return el("span","tag "+(req?"req":"rec"), req?T.required:T.recommended);
}
function areaItem(it){
  var k=it[0],d=T.f[k],w=el("div","field"),id="f_"+k;
  var head=el("div","qhead");
  var l=el("label","q",d[0]);l.setAttribute("for",id);head.appendChild(l);
  if(it[2])head.appendChild(tag(true));
  w.appendChild(head);
  if(d[1])w.appendChild(el("p","hint",d[1]));
  if(d[2])w.appendChild(explain(d[2]));
  var short=(k==="i_named"||k==="d_safetext");
  var ta=short?document.createElement("input"):document.createElement("textarea");
  if(short)ta.type="text";else ta.rows=2;
  ta.id=id;ta.value=S.f[k]||"";
  ta.addEventListener("input",function(){S.f[k]=ta.value;refreshBadge();save();});
  w.appendChild(ta);return w;
}
function checkItem(it){
  var k=it[0],d=T.f[k];
  var l=el("label","choice"+(it[2]?" reqc":""));
  var i=document.createElement("input");i.type="checkbox";i.checked=chk(k);
  i.addEventListener("change",function(){S.c[k]=i.checked;refreshBadge();save();});
  var s=el("span","");
  s.appendChild(el("strong","ui",esc(d[0])));
  if(it[2])s.appendChild(tag(true));
  if(d[1])s.appendChild(el("span","sub",esc(d[1])));
  l.appendChild(i);l.appendChild(s);
  var w=el("div","");w.appendChild(l);
  if(d[2])w.appendChild(explain(d[2]));
  return w;
}
function multiItem(it){
  var k=it[0],d=T.f[k];
  var w=el("div","field");
  w.appendChild(el("label","q",d[0]));
  if(d[1])w.appendChild(el("p","hint",d[1]));
  var keys=(k==="j_collect")?COLLECT:DIGMET;
  var dict=(k==="j_collect")?T.collect:T.digmet;
  var box=el("div","choices");
  keys.forEach(function(ck){
    var key=k+"_"+ck;
    var l=el("label","choice");
    var i=document.createElement("input");i.type="checkbox";i.checked=chk(key);
    i.addEventListener("change",function(){S.c[key]=i.checked;save();});
    l.appendChild(i);l.appendChild(el("span","",esc(dict[ck])));
    box.appendChild(l);
  });
  w.appendChild(box);return w;
}
function renderItem(it){
  if(it[1]==="check")return checkItem(it);
  if(it[1]==="multi")return multiItem(it);
  return areaItem(it);
}

/* ---------- panels ---------- */
function intro(p){
  p.appendChild(el("h2","",T.introTitle));
  p.appendChild(el("p","lede",T.introP1));
  p.appendChild(el("p","lede",T.introP2));

  p.appendChild(el("h3","",T.typeH));
  p.appendChild(el("p","hint",T.typeHint));
  var box=el("div","choices typechoices");
  TYPES.forEach(function(t){
    var l=el("label","choice big");
    var i=document.createElement("input");i.type="checkbox";i.checked=!!S.types[t];
    i.addEventListener("change",function(){S.types[t]=i.checked;save();build();});
    var s=el("span","");
    s.appendChild(el("strong","ui",esc(T.types[t][0])));
    s.appendChild(el("span","sub",esc(T.types[t][1])));
    l.appendChild(i);l.appendChild(s);box.appendChild(l);
  });
  p.appendChild(box);

  p.appendChild(el("h3","",T.ventureH));
  var g=el("div","twoup");
  [["vname",T.mVname],["vwho",T.mVwho],["vmentor",T.mVmentor]].forEach(function(m){
    var d=el("div","field");
    var l=el("label","q",m[1]);l.setAttribute("for","m_"+m[0]);
    var i=document.createElement("input");i.type="text";i.id="m_"+m[0];i.value=S.meta[m[0]]||"";
    i.addEventListener("input",function(){S.meta[m[0]]=i.value;save();});
    d.appendChild(l);d.appendChild(i);g.appendChild(d);
  });
  p.appendChild(g);

  p.appendChild(el("h3","",T.whatIs));
  var u=el("ul","");T.whatList.forEach(function(t){u.appendChild(el("li","",esc(t)));});
  p.appendChild(u);
  p.appendChild(el("h3","",T.patterns));
  var u2=el("ul","");T.patternList.forEach(function(t){u2.appendChild(el("li","",esc(t)));});
  p.appendChild(u2);
  var n=el("div","principle");n.appendChild(el("p","",T.sieveNote));p.appendChild(n);
  p.appendChild(el("p","small",T.disclaimer));
}

function sectionPanel(p,sec,idx){
  var d=T.sections[sec.id];
  p.appendChild(el("p","eyebrow",T.nav[idx]));
  p.appendChild(el("h2","",d.t));
  p.appendChild(el("p","lede",d.lede));
  var cols=el("div","cols"),left=el("div"),right=el("div");
  var pr=el("div","principle");
  pr.appendChild(el("p","eyebrow",T.whyQ));
  pr.appendChild(el("p","",d.p));
  left.appendChild(pr);
  visibleItems(sec).forEach(function(it){ left.appendChild(renderItem(it)); });
  var st=el("div","passes");
  st.id="badge_"+sec.id;
  right.appendChild(st);
  cols.appendChild(left);cols.appendChild(right);p.appendChild(cols);
}

/* ---------- readiness ---------- */
function assess(){
  var req=[],rec=[],reqDone=0,recDone=0;
  planItems().forEach(function(it){
    var ok=itemDone(it);
    if(it[1]==="multi") return;
    if(it[2]){ if(ok)reqDone++; else req.push(it[0]); }
    else { if(ok)recDone++; else rec.push(it[0]); }
  });
  var reqTotal=reqDone+req.length, recTotal=recDone+rec.length;
  var v;
  if(!anyType()) v="nodate";
  else if(req.length) v="postpone";
  else if(rec.length) v="nearly";
  else v="ready";
  return {req:req,rec:rec,reqDone:reqDone,reqTotal:reqTotal,recDone:recDone,recTotal:recTotal,
          v:v,title:T.verdict[v][0],note:T.verdict[v][1]};
}
function sectionBadge(sec){
  var items=visibleItems(sec).filter(function(it){return it[1]!=="multi";});
  var done=items.filter(itemDone).length;
  var open=items.filter(function(it){return it[2]&&!itemDone(it);}).length;
  return {done:done,total:items.length,openReq:open};
}
function refreshBadge(){
  visibleSections().forEach(function(sec){
    var host=document.getElementById("badge_"+sec.id);
    if(!host)return;
    var b=sectionBadge(sec);
    host.innerHTML="";
    host.appendChild(el("p","eyebrow",T.sum.progressH));
    var bar=el("div","mini");
    var fill=el("i","");fill.style.width=(b.total?Math.round(b.done/b.total*100):0)+"%";
    if(b.openReq)fill.style.background="var(--orange)";
    bar.appendChild(fill);host.appendChild(bar);
    host.appendChild(el("p","",b.done+" / "+b.total));
    if(b.openReq) host.appendChild(el("p","small warnTxt",b.openReq+" \u00d7 "+T.required));
  });
  var vr=document.getElementById("vSmall");
  if(vr){ var a=assess(); vr.textContent=a.title; vr.className="vpill v_"+a.v; }
}

/* ---------- summary ---------- */
function summaryHTML(){
  var a=assess(),U=T.sum,m=S.meta,h="";
  var typeNames=TYPES.filter(hasType).map(function(t){return T.types[t][0];}).join(" \u00b7 ");
  h+="<div class='sumhead'><div><h3>"+(esc(m.vname)||U.untitled)+"</h3>";
  h+="<p class='small'>"+U.whoL+": "+(esc(m.vwho)||"\u2014")+(m.vmentor?" \u00b7 "+U.mentorL+": "+esc(m.vmentor):"")+"</p></div>";
  h+="<p class='small'>"+U.stamp+" \u00b7 "+new Date().toLocaleDateString(lang==="fr"?"fr-FR":"en-GB")+"</p></div>";
  h+="<div class='verdict v_"+a.v+"'><h3>"+esc(a.title)+"</h3><p>"+esc(a.note)+"</p>"
    +"<p class='small'>"+sub(U.ofRequired,a.reqDone,a.reqTotal)+" \u00b7 "+sub(U.ofRec,a.recDone,a.recTotal)+"</p></div>";
  if(typeNames) h+="<p class='small'><strong class='ui'>"+U.typesH+":</strong> "+esc(typeNames)+"</p>";

  h+="<h3>"+U.reqH+"</h3>";
  if(a.req.length){ h+="<ul class='small reqlist'>"; a.req.forEach(function(k){ h+="<li>"+esc(T.f[k][0])+"</li>"; }); h+="</ul>"; }
  else h+="<p class='small ok'>"+U.allClear+"</p>";

  h+="<h3>"+U.testH+"</h3><dl class='answers'>";
  ["q_one","q_yes","q_no","q_small"].forEach(function(k){ if(txt(k)) h+="<dt>"+esc(T.f[k][0])+"</dt><dd>"+esc(txt(k))+"</dd>"; });
  h+="</dl>";

  h+="<h3>"+U.peopleH+"</h3><dl class='answers'>";
  ["p_roles","p_assume","c_site","i_named","d_safetext","f_datacost"].forEach(function(k){
    if(txt(k)) h+="<dt>"+esc(T.f[k][0])+"</dt><dd>"+esc(txt(k))+"</dd>"; });
  h+="</dl>";

  h+="<h3>"+U.measureH+"</h3><dl class='answers'>";
  ["j_compare","j_observe"].forEach(function(k){ if(txt(k)) h+="<dt>"+esc(T.f[k][0])+"</dt><dd>"+esc(txt(k))+"</dd>"; });
  h+="</dl>";
  var coll=COLLECT.filter(function(c){return chk("j_collect_"+c);}).map(function(c){return T.collect[c];});
  if(coll.length){ h+="<ul class='small'>"; coll.forEach(function(c){ h+="<li>"+esc(c)+"</li>"; }); h+="</ul>"; }
  if(hasType("digital")){
    var dm=DIGMET.filter(function(c){return chk("j_digital_"+c);}).map(function(c){return T.digmet[c];});
    if(dm.length){ h+="<ul class='small'>"; dm.forEach(function(c){ h+="<li>"+esc(c)+"</li>"; }); h+="</ul>"; }
  }

  if(a.rec.length){
    h+="<h3 class='noprint'>"+U.recH+"</h3><ul class='small noprint'>";
    a.rec.forEach(function(k){ h+="<li>"+esc(T.f[k][0])+"</li>"; }); h+="</ul>";
  }

  var dk=["k_result","k_notwork","k_notunderstood","k_notwanted","k_notworth","k_change","k_next"];
  var any=dk.some(function(k){return txt(k);});
  if(any){
    h+="<h3>"+U.debriefH+"</h3><dl class='answers'>";
    dk.forEach(function(k){ if(txt(k)) h+="<dt>"+esc(T.f[k][0])+"</dt><dd>"+esc(txt(k))+"</dd>"; });
    h+="</dl>";
  }
  h+="<div class='signrow'><span>"+U.signH+" ……………………………………</span><span>"+U.dateH+" ………………………</span></div>";
  h+="<p class='foot'>"+esc(U.foot)+"</p>";
  return h;
}
function renderSummary(){
  var sheet=document.querySelector("#p-summary .sheet");
  sheet.innerHTML=summaryHTML();
  var dl=document.getElementById("dlBtn");
  if(dl&&window.__dlSave){
    dl.hidden=false;
    dl.onclick=function(){
      var nm=(S.meta.vname||"field-test").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"field-test";
      var doc="<!DOCTYPE html><html lang='"+lang+"'><meta charset='utf-8'><title>"+esc(T.sum.stamp)+"</title>"
        +"<style>body{font-family:Georgia,serif;max-width:820px;margin:40px auto;padding:0 20px;color:#222;line-height:1.55}"
        +"h3{font-family:system-ui,sans-serif}.verdict{background:#f4f1ec;padding:14px;border-radius:8px}"
        +".small{font-size:13px;color:#666}dt{font-weight:bold;margin-top:10px}dd{margin:2px 0 0}"
        +".sumhead{display:flex;justify-content:space-between}</style>"+summaryHTML();
      window.__dlSave(nm+"-field-test-plan.html",doc);
    };
  }
}

/* ---------- build ---------- */
function build(){
  document.documentElement.lang=lang;
  document.title="Field testing \u2014 "+T.brand;
  document.getElementById("tagline").textContent=T.brand;
  document.getElementById("skipLink").textContent=T.skip;
  document.getElementById("langBtn").textContent=T.other;
  document.getElementById("langBtn").setAttribute("lang",T.otherCode);
  document.getElementById("resetBtn").textContent=T.clear;
  document.getElementById("stepNavWrap").setAttribute("aria-label",T.progress);
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  document.getElementById("themeBtn").textContent=dark?T.theme[1]:T.theme[0];

  var vis=visibleSections();
  ORDER=["start"].concat(vis.map(function(s){return s.id;})).concat(["summary"]);
  var navIdx={start:0,summary:12};
  SECTIONS.forEach(function(s,i){ navIdx[s.id]=i+1; });

  var panels=document.getElementById("panels"),nav=document.getElementById("stepNav");
  panels.innerHTML="";nav.innerHTML="";
  if(cur>=ORDER.length)cur=ORDER.length-1;

  ORDER.forEach(function(id,i){
    var p=el("section","panel");p.id="p-"+id;
    if(id==="start")intro(p);
    else if(id==="summary"){p.appendChild(el("h2","",T.sum.plan));p.appendChild(el("div","sheet",""));}
    else sectionPanel(p,vis[i-1],navIdx[id]);

    var row=el("div","navrow noprint");
    if(i>0){var b=el("button","btn sec",T.back);b.type="button";b.onclick=function(){go(i-1);};row.appendChild(b);}
    if(i<ORDER.length-1){var n=el("button","btn primary",i===0?T.startBtn:T.next);n.type="button";
      n.onclick=function(){go(i+1);};row.appendChild(n);}
    if(id==="summary"){
      var pr=el("button","btn primary",T.print);pr.type="button";pr.onclick=function(){window.print();};row.appendChild(pr);
      var dl=el("button","btn sec",T.download);dl.type="button";dl.id="dlBtn";dl.hidden=true;row.appendChild(dl);
    }
    var sv=el("span","saved");sv.id="savedNote";row.appendChild(sv);
    p.appendChild(row);panels.appendChild(p);

    var li=document.createElement("li");
    var nb=el("button","","<span class='dot'>"+(i+1)+"</span><span>"+esc(T.nav[navIdx[id]])+"</span>");
    nb.type="button";nb.onclick=function(){go(i);};
    li.appendChild(nb);nav.appendChild(li);
  });
  go(cur);
}
function go(i){
  cur=Math.max(0,Math.min(ORDER.length-1,i));
  var panels=document.getElementById("panels"),nav=document.getElementById("stepNav");
  Array.prototype.forEach.call(panels.children,function(p,n){p.classList.toggle("on",n===cur);});
  Array.prototype.forEach.call(nav.children,function(li,n){
    var b=li.firstChild;
    if(n===cur)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");
    b.classList.toggle("done",n<cur);
  });
  document.getElementById("barFill").style.width=(cur/(ORDER.length-1)*100)+"%";
  document.getElementById("live").textContent=sub(T.stepOf,cur+1,ORDER.length,T.nav[0]);
  refreshBadge();
  if(ORDER[cur]==="summary")renderSummary();
  window.scrollTo(0,0);
  try{history.replaceState(null,"","#"+ORDER[cur]);}catch(e){}
}

document.getElementById("themeBtn").addEventListener("click",function(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  var nx=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",nx);
  this.textContent=nx==="dark"?T.theme[1]:T.theme[0];
  try{localStorage.setItem(KEY+".theme",nx);}catch(e){}
});
document.getElementById("langBtn").addEventListener("click",function(){
  lang=(lang==="en")?"fr":"en";T=L[lang];
  try{localStorage.setItem(KEY+".lang",lang);}catch(e){}
  build();
});
document.getElementById("resetBtn").addEventListener("click",function(){
  if(!confirm(T.confirmClear))return;
  try{localStorage.removeItem(KEY);}catch(e){}
  S={meta:{},f:{},c:{},types:{}};cur=0;build();
});

load();
try{var th=localStorage.getItem(KEY+".theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
build();
var hash=(location.hash||"").replace("#","");
if(hash&&ORDER.indexOf(hash)>-1)go(ORDER.indexOf(hash));

if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("downloads").then(function(d){
    if(!d)return;
    window.__dlSave=function(f,data){try{d.save({filename:f,data:data});}catch(e){}};
    if(ORDER[cur]==="summary")renderSummary();
  }).catch(function(){});
}
})();

</script>
</body>
</html>
